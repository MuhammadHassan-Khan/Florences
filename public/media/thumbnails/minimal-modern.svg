<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Minimal Modern preview artwork">
  <rect width="640" height="400" fill="#f3f2ed"/>

  <!-- editorial type-lines -->
  <g fill="#17171a">
    <rect x="64" y="72" width="230" height="10"/>
    <rect x="64" y="98" width="170" height="10"/>
    <rect x="64" y="124" width="112" height="10"/>
  </g>
  <rect x="64" y="158" width="56" height="4" fill="#c9a24b"/>

  <!-- outlined circle + accent dot -->
