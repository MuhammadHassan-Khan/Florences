<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Luxury Cinematic preview artwork">
  <defs>
    <linearGradient id="lc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="0.55" stop-color="#151119"/>
      <stop offset="1" stop-color="#1e1510"/>
    </linearGradient>
    <radialGradient id="lc-glow" cx="0.74" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#f3c877" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#c9873a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#c9873a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lc-beam" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe6b0" stop-opacity="0"/>
    </linearGradient>
    <filter id="lc-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="lc-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#lc-bg)"/>
  <rect width="640" height="400" fill="url(#lc-glow)"/>

  <!-- sweeping stage light -->
  <polygon points="640,-20 640,140 330,400 500,400" fill="url(#lc-beam)" filter="url(#lc-soft)" opacity="0.75"/>

  <!-- bokeh highlights -->
  <g fill="#f0c271" filter="url(#lc-blur)">
    <circle cx="96" cy="304" r="20" opacity="0.16"/>
    <circle cx="158" cy="344" r="11" opacity="0.3"/>
    <circle cx="556" cy="308" r="26" opacity="0.14"/>
    <circle cx="498" cy="352" r="13" opacity="0.26"/>
    <circle cx="430" cy="74" r="8" opacity="0.4"/>
    <circle cx="126" cy="96" r="6" opacity="0.34"/>
    <circle cx="612" cy="128" r="15" opacity="0.2"/>
    <circle cx="52" cy="170" r="9" opacity="0.22"/>
  </g>

  <!-- paired rings motif -->
  <g fill="none" stroke="#d9b467" stroke-width="2.5" opacity="0.9">
    <circle cx="304" cy="300" r="17"/>
    <circle cx="336" cy="300" r="17"/>
  </g>

  <!-- film frame -->
  <rect x="16" y="16" width="608" height="368" rx="4" fill="none" stroke="#c9a24b" stroke-opacity="0.75" stroke-width="1.5"/>
</svg>
