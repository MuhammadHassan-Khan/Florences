<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Sample artwork — symmetrical gold rosette medallion on an emerald ground</title>
  <defs>
    <linearGradient id="rh3-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3b2d" />
      <stop offset="1" stop-color="#06281e" />
    </linearGradient>
    <radialGradient id="rh3-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9d9ae" stop-opacity="0.22" />
      <stop offset="1" stop-color="#e9d9ae" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Emerald ground -->
  <rect width="800" height="600" fill="url(#rh3-ground)" />

  <!-- Ceremonial double border -->
  <rect x="24" y="24" width="752" height="552" rx="10" fill="none" stroke="#c9a24b" stroke-opacity="0.4" stroke-width="2" />
  <rect x="36" y="36" width="728" height="528" rx="6" fill="none" stroke="#c9a24b" stroke-opacity="0.18" />

  <!-- Medallion glow -->
  <circle cx="400" cy="300" r="250" fill="url(#rh3-glow)" />

  <!-- Outer rings -->
  <circle cx="400" cy="300" r="240" fill="none" stroke="#c9a24b" stroke-opacity="0.25" stroke-width="2" />
  <circle cx="400" cy="300" r="212" fill="none" stroke="#c9a24b" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 20" />

  <!-- Petal ring (12 petals) -->
  <g fill="none" stroke="#c9a24b" stroke-opacity="0.6" stroke-width="1.6">
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(30 400 300)" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(60 400 300)" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(90 400 300)" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(120 400 300)" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(150 400 300)" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(180 400 300)" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(210 400 300)" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(240 400 300)" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(270 400 300)" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(300 400 300)" />
    <path d="M400 118 C 430 162 430 202 400 232 C 370 202 370 162 400 118 Z" transform="rotate(330 400 300)" />
  </g>

  <!-- Inner disc -->
  <circle cx="400" cy="300" r="150" fill="#0f4a37" stroke="#c9a24b" stroke-opacity="0.7" stroke-width="2" />
  <circle cx="400" cy="300" r="140" fill="none" stroke="#c9a24b" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 16" />

  <!-- Eight-point star -->
  <g fill="none" stroke="#c9a24b" stroke-opacity="0.8" stroke-width="1.8">
    <rect x="330" y="230" width="140" height="140" />
    <rect x="330" y="230" width="140" height="140" transform="rotate(45 400 300)" />
  </g>

  <!-- Heart of the rosette -->
  <circle cx="400" cy="300" r="48" fill="none" stroke="#c9a24b" stroke-opacity="0.8" stroke-width="2" />
  <circle cx="400" cy="300" r="16" fill="#c9a24b" fill-opacity="0.9" />
</svg>
