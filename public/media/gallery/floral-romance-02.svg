<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Sample artwork — a leafy sage branch on an ivory ground">
  <defs>
    <linearGradient id="fr2-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f4ea"/>
      <stop offset="0.55" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#f7ece9"/>
    </linearGradient>
    <radialGradient id="fr2-wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cdd6c6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#cdd6c6" stop-opacity="0"/>
    </radialGradient>
    <g id="fr2-leaf">
      <path d="M0 0 C -18 -16, -14 -46, 10 -58 C 26 -34, 20 -12, 0 0 Z" fill="#7d8c77"/>
      <path d="M0 0 C -3 -20, 1 -40, 10 -58" fill="none" stroke="#f6f4ea" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="fr2-leaf-pale">
      <path d="M0 0 C -18 -16, -14 -46, 10 -58 C 26 -34, 20 -12, 0 0 Z" fill="#a7b39f"/>
      <path d="M0 0 C -3 -20, 1 -40, 10 -58" fill="none" stroke="#f6f4ea" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#fr2-bg)"/>
  <ellipse cx="620" cy="150" rx="250" ry="190" fill="url(#fr2-wash)"/>
  <ellipse cx="170" cy="470" rx="230" ry="170" fill="url(#fr2-wash)" opacity="0.7"/>

  <!-- main branch, sweeping from the lower-left corner -->
  <g fill="none" stroke="#7d8c77" stroke-linecap="round">
    <path d="M40 566 C 160 502, 252 424, 362 332 C 472 240, 596 170, 744 66" stroke-width="5"/>
    <path d="M362 332 C 396 384, 404 442, 386 504" stroke-width="3"/>
    <path d="M566 196 C 604 214, 640 246, 660 288" stroke-width="3"/>
  </g>

  <!-- leaves along the branch -->
  <g>
    <use href="#fr2-leaf" transform="translate(109 526) rotate(-45) scale(1.15)" opacity="0.92"/>
    <use href="#fr2-leaf-pale" transform="translate(174 483) rotate(135) scale(0.95)" opacity="0.9"/>
    <use href="#fr2-leaf" transform="translate(142 505) rotate(-40) scale(1.05)" opacity="0.88"/>
    <use href="#fr2-leaf" transform="translate(236 436) rotate(138) scale(1.1)" opacity="0.9"/>
    <use href="#fr2-leaf-pale" transform="translate(298 386) rotate(-48) scale(1)" opacity="0.85"/>
    <use href="#fr2-leaf" transform="translate(330 359) rotate(132) scale(1.05)" opacity="0.9"/>
    <use href="#fr2-leaf" transform="translate(430 279) rotate(-44) scale(1)" opacity="0.86"/>
    <use href="#fr2-leaf-pale" transform="translate(465 254) rotate(140) scale(0.9)" opacity="0.85"/>
    <use href="#fr2-leaf" transform="translate(539 204) rotate(-50) scale(0.95)" opacity="0.88"/>
    <use href="#fr2-leaf" transform="translate(577 178) rotate(136) scale(0.88)" opacity="0.85"/>
    <use href="#fr2-leaf-pale" transform="translate(617 152) rotate(-46) scale(0.85)" opacity="0.85"/>
    <use href="#fr2-leaf" transform="translate(658 125) rotate(134) scale(0.78)" opacity="0.85"/>
    <use href="#fr2-leaf-pale" transform="translate(700 96) rotate(-46) scale(0.72)" opacity="0.82"/>
    <!-- side shoots -->
    <use href="#fr2-leaf" transform="translate(386 504) rotate(148) scale(0.95)" opacity="0.88"/>
    <use href="#fr2-leaf-pale" transform="translate(395 459) rotate(-56) scale(0.85)" opacity="0.85"/>
    <use href="#fr2-leaf" transform="translate(660 288) rotate(128) scale(0.9)" opacity="0.86"/>
    <use href="#fr2-leaf-pale" transform="translate(646 254) rotate(-38) scale(0.8)" opacity="0.84"/>
  </g>

  <!-- rose-tinged buds at the tips -->
  <g>
    <circle cx="744" cy="66" r="14" fill="#d98ea0" opacity="0.85"/>
    <circle cx="744" cy="66" r="6" fill="#e6c173" opacity="0.9"/>
    <circle cx="386" cy="504" r="11" fill="#e8b3bf" opacity="0.9"/>
    <circle cx="660" cy="288" r="9" fill="#d98ea0" opacity="0.75"/>
    <circle cx="40" cy="566" r="10" fill="#e8b3bf" opacity="0.8"/>
  </g>

  <!-- loose drifting leaflets -->
  <g opacity="0.45">
    <use href="#fr2-leaf-pale" transform="translate(140 160) rotate(196) scale(0.6)"/>
    <use href="#fr2-leaf-pale" transform="translate(600 470) rotate(34) scale(0.55)"/>
    <use href="#fr2-leaf" transform="translate(520 540) rotate(-160) scale(0.5)"/>
  </g>

  <rect x="22" y="22" width="756" height="556" rx="12" fill="none" stroke="#7d8c77" stroke-opacity="0.4" stroke-width="2"/>
</svg>
