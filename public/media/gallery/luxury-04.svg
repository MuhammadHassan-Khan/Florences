<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Placeholder artwork: floral garland detail">
  <defs>
    <linearGradient id="g4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efe0"/>
      <stop offset="1" stop-color="#efe0c8"/>
    </linearGradient>
    <g id="g4-marigold">
      <circle r="26" fill="#e89b3c"/>
      <circle r="18" fill="#f2b45c"/>
      <circle r="9" fill="#f7d488"/>
    </g>
    <g id="g4-leaf">
      <path d="M0 0 q 26 -14 46 0 q -20 20 -46 0" fill="#7d8c77"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#g4-bg)"/>

  <!-- garland cords -->
  <g fill="none" stroke="#b98f45" stroke-width="3">
    <path d="M-10 130 C 180 260, 420 60, 810 190"/>
    <path d="M-10 330 C 220 430, 520 250, 810 380"/>
  </g>

  <!-- marigolds along cords -->
  <g>
    <use href="#g4-marigold" x="60" y="176"/>
    <use href="#g4-marigold" x="150" y="212" transform="scale(0.85)" transform-origin="150 212"/>
    <use href="#g4-marigold" x="250" y="222"/>
    <use href="#g4-marigold" x="350" y="184" transform="scale(0.8)" transform-origin="350 184"/>
    <use href="#g4-marigold" x="450" y="150"/>
    <use href="#g4-marigold" x="560" y="150" transform="scale(0.85)" transform-origin="560 150"/>
    <use href="#g4-marigold" x="670" y="170"/>
    <use href="#g4-marigold" x="760" y="186" transform="scale(0.8)" transform-origin="760 186"/>
  </g>
  <g>
    <use href="#g4-marigold" x="80" y="360" transform="scale(0.9)" transform-origin="80 360"/>
    <use href="#g4-marigold" x="200" y="396"/>
    <use href="#g4-marigold" x="330" y="388" transform="scale(0.8)" transform-origin="330 388"/>
    <use href="#g4-marigold" x="460" y="352"/>
    <use href="#g4-marigold" x="580" y="348" transform="scale(0.85)" transform-origin="580 348"/>
    <use href="#g4-marigold" x="700" y="372"/>
  </g>

  <!-- leaves -->
  <g opacity="0.85">
    <use href="#g4-leaf" x="110" y="240"/>
    <use href="#g4-leaf" x="300" y="238" transform="rotate(14 300 238)"/>
    <use href="#g4-leaf" x="500" y="182" transform="rotate(-12 500 182)"/>
    <use href="#g4-leaf" x="640" y="204" transform="rotate(10 640 204)"/>
    <use href="#g4-leaf" x="150" y="430" transform="rotate(-16 150 430)"/>
    <use href="#g4-leaf" x="400" y="410" transform="rotate(12 400 410)"/>
    <use href="#g4-leaf" x="640" y="404" transform="rotate(-8 640 404)"/>
  </g>

  <!-- roses accent -->
  <g>
    <circle cx="170" cy="90" r="34" fill="#d98ea0" opacity="0.9"/>
    <circle cx="170" cy="90" r="20" fill="#e8aab8"/>
    <circle cx="170" cy="90" r="8" fill="#c9738a"/>
    <circle cx="640" cy="500" r="40" fill="#d98ea0" opacity="0.9"/>
    <circle cx="640" cy="500" r="24" fill="#e8aab8"/>
    <circle cx="640" cy="500" r="10" fill="#c9738a"/>
