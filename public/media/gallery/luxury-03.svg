<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Placeholder artwork: decorated stage drapery">
  <defs>
    <linearGradient id="d3-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d1418"/>
      <stop offset="1" stop-color="#240d10"/>
    </linearGradient>
    <linearGradient id="d3-fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d1f24"/>
      <stop offset="0.5" stop-color="#8a3038"/>
      <stop offset="1" stop-color="#5d1f24"/>
    </linearGradient>
    <linearGradient id="d3-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d79a"/>
      <stop offset="1" stop-color="#b98f45"/>
    </linearGradient>
    <filter id="d3-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#d3-bg)"/>

  <!-- warm stage glow -->
  <ellipse cx="400" cy="330" rx="230" ry="170" fill="#f0b95e" opacity="0.16" filter="url(#d3-glow)"/>

  <!-- drapery folds -->
  <g fill="url(#d3-fold)">
    <path d="M0 0 H120 C110 160 130 330 96 600 H0 Z"/>
    <path d="M120 0 H240 C236 190 250 360 226 600 H104 C132 340 116 170 120 0 Z"/>
    <path d="M660 0 H780 V600 H716 C686 350 700 180 660 0 Z" transform="scale(-1,1) translate(-1440,0)"/>
    <path d="M680 0 H800 V600 H716 C748 340 730 170 680 0 Z"/>
    <path d="M560 0 H680 C674 180 690 350 664 600 H548 C572 350 562 180 560 0 Z"/>
  </g>

  <!-- gold valance -->
  <path d="M0 0 H800 V70 C700 130 620 60 520 110 C420 160 340 70 240 120 C150 165 80 90 0 130 Z" fill="url(#d3-gold)" opacity="0.92"/>
  <path d="M0 130 C80 90 150 165 240 120 C340 70 420 160 520 110 C620 60 700 130 800 70" fill="none" stroke="#fff0c9" stroke-opacity="0.6" stroke-width="3"/>

  <!-- hanging tassels -->
  <g stroke="url(#d3-gold)" stroke-width="4" fill="none">
    <path d="M200 122 V170"/>
    <path d="M400 108 V156"/>
    <path d="M600 96 V144"/>
  </g>
  <g fill="#f0d79a">
    <circle cx="200" cy="178" r="9"/>
    <circle cx="400" cy="164" r="9"/>
    <circle cx="600" cy="152" r="9"/>
  </g>

  <!-- aisle candles -->
  <g fill="#fdf8ec" opacity="0.9">
    <rect x="330" y="500" width="26" height="66" rx="6"/>
    <rect x="444" y="520" width="26" height="46" rx="6"/>
  </g>
  <g fill="#ffcf6e">
    <ellipse cx="343" cy="489" rx="8" ry="14"/>
    <ellipse cx="457" cy="509" rx="8" ry="14"/>
  </g>
</svg>
