<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Placeholder artwork: golden bokeh lights">
  <defs>
    <linearGradient id="b1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d12"/>
      <stop offset="0.6" stop-color="#181219"/>
      <stop offset="1" stop-color="#241a12"/>
    </linearGradient>
    <radialGradient id="b1-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#e0a44f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e0a44f" stop-opacity="0"/>
    </radialGradient>
    <filter id="b1-soft" x="-60%" y="-60%" width="220%" height="220%">
