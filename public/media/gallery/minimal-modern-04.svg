<!-- Minimal Modern plate 04 — ink block composition (original placeholder artwork). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Placeholder artwork: ink block composition">
  <rect width="800" height="600" fill="#ffffff"/>

  <!-- Solid ink mass with ledger rules -->
  <rect x="60" y="60" width="300" height="460" fill="#101014"/>
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1">
    <line x1="60" y1="160" x2="360" y2="160"/>
    <line x1="60" y1="260" x2="360" y2="260"/>
    <line x1="60" y1="360" x2="360" y2="360"/>
    <line x1="60" y1="460" x2="360" y2="460"/>
  </g>

  <!-- Accent block -->
  <rect x="390" y="60" width="150" height="150" fill="#b4472f"/>

  <!-- Outlined block with a hairline grid -->
  <rect x="390" y="240" width="150" height="280" fill="none" stroke="#101014" stroke-opacity="0.45" stroke-width="1.5"/>
  <g stroke="#101014" stroke-opacity="0.2" stroke-width="1">
    <line x1="390" y1="310" x2="540" y2="310"/>
    <line x1="390" y1="380" x2="540" y2="380"/>
    <line x1="390" y1="450" x2="540" y2="450"/>
    <line x1="440" y1="240" x2="440" y2="520"/>
    <line x1="490" y1="240" x2="490" y2="520"/>
  </g>

  <!-- Right column: outline over mass -->
  <rect x="570" y="60" width="170" height="170" fill="none" stroke="#101014" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="570" y="260" width="170" height="260" fill="#101014"/>

  <!-- Ground rule -->
  <line x1="60" y1="560" x2="740" y2="560" stroke="#101014" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="724" y="552" width="16" height="16" fill="#b4472f"/>
</svg>
